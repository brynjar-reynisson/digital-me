
data.dir=.

# Postgres connection for application storage + pgvector embeddings.
# This is the Supabase local dev stack's Postgres instance (already running,
# also serving agent-suite/soulman's own schemas) — not a dedicated
# digital-me database. digital-me gets its own schema (digitalme) inside
# the shared "postgres" database, matching how agent-suite/soulman do it.
# postgres.password resolves from the POSTGRES_PASSWORD env var, falling
# back to the literal "postgres" (Supabase CLI's own local-dev default) so
# nothing secret needs to be committed.
postgres.host=localhost
postgres.port=54322
postgres.database=postgres
postgres.user=postgres
postgres.password=${POSTGRES_PASSWORD:postgres}
postgres.schema=digitalme

# Personal single-user tool; no reason to accept connections from other machines
server.address=127.0.0.1

# the name of Camel
camel.springboot.name = CamelRouter
camel.springboot.routes-include-pattern = file:${data.dir}/routes/*.xml

# to automatic shutdown the JVM after a period of time
#camel.springboot.duration-max-seconds=60
#camel.springboot.duration-max-messages=100

# add for example: &repeatCount=5 to the timer endpoint to make Camel idle
#camel.springboot.duration-max-idle-seconds=15

# expose actuator endpoint via HTTP
management.endpoints.web.exposure.include=info,health,camelroutes

# turn on actuator health check
management.endpoint.health.enabled = true

# allow to obtain basic information about camel routes (read only mode)
management.endpoint.camelroutes.enabled = true
management.endpoint.camelroutes.read-only = true

# to configure logging levels
#logging.level.org.springframework = INFO
#logging.level.org.apache.camel.spring.boot = INFO
#logging.level.org.apache.camel.impl = DEBUG
#logging.level.sample.camel = DEBUG
logging.file.name=${data.dir}/logs/app.log

server.tomcat.use-relative-redirects=true

# Thread pool size for @Scheduled components (FileChangeWatcher, AddContentQueueProcessor, ClaudeSessionIndexer).
# Sized to allow concurrent execution without blocking — prevents long-running indexing passes from delaying queue processing.
spring.task.scheduling.pool.size=3

# Local AI (Ollama) for semantic search of mcp-resources
# ollama.url=http://localhost:11434
# ollama.embedding.model=nomic-embed-text
# ollama.summarize.model=llama3.2
# ollama.embedding.document-prefix=search_document:
# ollama.embedding.query-prefix=search_query:
# semantic-search.min-score=0.5

# Max concurrent embedding jobs run by addContent's background worker pool. Bursts of
# submissions (e.g. fast browsing, several screenshot flushes) queue instead of firing
# unbounded concurrent Ollama calls. 1 is the safest default for CPU-only inference.
# embedding.executor.pool-size=1

# Summarization backend: must be exactly "deepseek" (default, via opencode CLI) or "ollama" —
# any other value leaves no SummarizeClient bean active and fails startup
# summarize.provider=deepseek
# opencode.command=opencode.cmd
# opencode.summarize.model=deepseek/deepseek-v4-flash
# opencode.summarize.timeout-seconds=60